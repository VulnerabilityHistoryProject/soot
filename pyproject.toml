[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "soot"
version = "0.1.0"
description = "Facilitating knowledge transfer with mutant releases"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }

[project.scripts]
soot = "soot.cli:main"

[tool.setuptools.packages.find]
include = ["soot*"]
